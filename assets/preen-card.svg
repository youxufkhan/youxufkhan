<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280" role="img" aria-labelledby="preen-title preen-desc">
  <title id="preen-title">Preen — Linux System Cleaner</title>
  <desc id="preen-desc">Clean, uninstall, analyze, and monitor Linux from one application.</desc>

  <defs>
    <clipPath id="preenClip">
      <rect width="600" height="280" rx="12"/>
    </clipPath>

    <!-- Official Preen Logo Gradients from repo -->
    <linearGradient id="preenLogoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1929"/>
      <stop offset="40%" stop-color="#0d233a"/>
      <stop offset="80%" stop-color="#062e3d"/>
      <stop offset="100%" stop-color="#04383a"/>
    </linearGradient>

    <linearGradient id="squircleStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="35%" stop-color="#00e699" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00e699" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="25%" stop-color="#00e699"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e0f2fe"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="leftVaneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="40%" stop-color="#00e699"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <linearGradient id="shaftGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#00e699" stop-opacity="0.1"/>
      <stop offset="20%" stop-color="#00e699"/>
      <stop offset="70%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <a href="https://preen.yousufkhan.uk/" target="_blank" style="cursor: pointer;">
    <!-- Card Frame -->
    <g clip-path="url(#preenClip)">
      <rect width="600" height="280" fill="#12161c"/>

      <!-- Window Header Bar -->
      <rect width="600" height="42" fill="#181e26"/>
      <line x1="0" y1="42" x2="600" y2="42" stroke="#252e3b" stroke-width="1"/>

      <!-- Window Control Dots -->
      <circle cx="20" cy="21" r="4" fill="#2d3744"/>
      <circle cx="32" cy="21" r="4" fill="#2d3744"/>
      <circle cx="44" cy="21" r="4" fill="#2d3744"/>

      <!-- Official Preen Logo Icon in Titlebar (22x22) -->
      <g transform="translate(60, 10) scale(0.043)">
        <rect x="36" y="36" width="440" height="440" rx="98" fill="url(#preenLogoBg)"/>
        <rect x="36" y="36" width="440" height="440" rx="98" fill="none" stroke="url(#squircleStroke)" stroke-width="4"/>
        <path d="M 175,372 C 158,350 148,318 152,286 C 172,298 198,314 212,334 C 200,358 186,370 175,372 Z" fill="url(#leftVaneGrad)"/>
        <path d="M 156,280 C 160,242 178,206 206,178 C 224,196 242,224 246,252 C 218,252 184,264 156,280 Z" fill="url(#leftVaneGrad)"/>
        <path d="M 212,172 C 244,138 290,104 340,78 C 342,98 334,128 316,154 C 284,170 248,172 212,172 Z" fill="url(#whiteGrad)"/>
        <path d="M 346,72 C 372,82 388,102 386,124 C 362,142 328,154 298,160 C 308,130 326,98 346,72 Z" fill="url(#whiteGrad)"/>
        <path d="M 384,132 C 402,154 404,180 392,204 C 356,212 312,208 276,198 C 314,180 354,158 384,132 Z" fill="url(#cyanGrad)"/>
        <path d="M 388,214 C 394,238 384,264 362,284 C 328,278 284,260 252,238 C 298,236 352,230 388,214 Z" fill="url(#cyanGrad)"/>
        <path d="M 356,292 C 344,316 318,336 286,344 C 262,330 238,298 226,272 C 264,286 316,294 356,292 Z" fill="url(#cyanGrad)"/>
        <path d="M 278,350 C 254,364 226,368 202,364 C 204,348 214,332 228,320 C 248,336 264,346 278,350 Z" fill="url(#leftVaneGrad)"/>
        <path d="M 160,396 C 172,360 198,300 242,230 C 284,164 326,108 348,70 C 346,74 306,128 266,192 C 224,260 196,324 178,396 Z" fill="url(#shaftGrad)"/>
        <g transform="translate(378, 64)">
          <path d="M 0,-30 Q 0,0 30,0 Q 0,0 0,30 Q 0,0 -30,0 Q 0,0 0,-30 Z" fill="#ffffff"/>
        </g>
      </g>

      <!-- Window Title -->
      <text x="90" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif"
            font-size="13.5" font-weight="600" fill="#f0f6fc">
        Preen
      </text>
      <text x="138" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif"
            font-size="12" font-weight="400" fill="#7d8b99">
        System cleaner for Ubuntu &amp; KDE
      </text>

      <!-- Architecture badge -->
      <text x="576" y="25" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="11" fill="#64748b">
        CLI + GUI &#183; Zero daemons
      </text>

      <!-- Scan Summary Block -->
      <g transform="translate(24, 60)">
        <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif"
              font-size="24" font-weight="600" fill="#f0f6fc">
          14.8 GB
        </text>
        <text x="104" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif"
              font-size="13" font-weight="400" fill="#8b949e">
          reclaimable storage identified
        </text>

        <!-- Proportional Storage Bar -->
        <g transform="translate(0, 34)">
          <rect width="552" height="8" rx="4" fill="#1f2732"/>
          <rect width="201" height="8" rx="4" fill="#10b981"/>
          <rect x="203" width="119" height="8" fill="#0284c7"/>
          <rect x="324" width="228" height="8" rx="4" fill="#475569"/>
        </g>
      </g>

      <!-- Inspection Details Rows -->
      <g transform="translate(24, 132)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif">
        <!-- Row 1: Developer Caches -->
        <g transform="translate(0, 0)">
          <circle cx="4" cy="7" r="3" fill="#10b981"/>
          <text x="16" y="11" font-size="13" font-weight="500" fill="#e6edf3">Developer caches</text>
          <text x="170" y="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#7d8b99">~/.cache (pnpm, npm, pip, uv, cargo)</text>
          <text x="552" y="11" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="500" fill="#cbd5e1">5.4 GB</text>
          <line x1="0" y1="23" x2="552" y2="23" stroke="#1c2430" stroke-width="1"/>
        </g>

        <!-- Row 2: Old Kernels & Snaps -->
        <g transform="translate(0, 32)">
          <circle cx="4" cy="7" r="3" fill="#0284c7"/>
          <text x="16" y="11" font-size="13" font-weight="500" fill="#e6edf3">Old kernels &amp; snap</text>
          <text x="170" y="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#7d8b99">disabled snap revisions, crash dumps, apt</text>
          <text x="552" y="11" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="500" fill="#cbd5e1">3.2 GB</text>
          <line x1="0" y1="23" x2="552" y2="23" stroke="#1c2430" stroke-width="1"/>
        </g>

        <!-- Row 3: Build Artifacts -->
        <g transform="translate(0, 64)">
          <circle cx="4" cy="7" r="3" fill="#475569"/>
          <text x="16" y="11" font-size="13" font-weight="500" fill="#e6edf3">Build folders</text>
          <text x="170" y="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#7d8b99">node_modules, target, .venv, build</text>
          <text x="552" y="11" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="500" fill="#cbd5e1">6.2 GB</text>
        </g>
      </g>

      <!-- Bottom Footer Strip -->
      <g transform="translate(0, 240)">
        <rect width="600" height="40" fill="#141a22"/>
        <line x1="0" y1="0" x2="600" y2="0" stroke="#202936" stroke-width="1"/>

        <!-- Left link -->
        <text x="24" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif"
              font-size="12" font-weight="500" fill="#10b981">
          preen.yousufkhan.uk
        </text>

        <!-- Right link -->
        <text x="576" y="24" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="11.5" font-weight="400" fill="#64748b">
          github.com/youxufkhan/preen
        </text>
      </g>
    </g>

    <!-- Hairline Border -->
    <rect width="600" height="280" rx="12" fill="none" stroke="#2b3542" stroke-width="1"/>
  </a>
</svg>