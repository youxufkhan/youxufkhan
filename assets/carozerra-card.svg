<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280" role="img" aria-labelledby="caro-title caro-desc">
  <title id="caro-title">Carozerra — Pioneer OEL Decoder</title>
  <desc id="caro-desc">Decode and play Pioneer car-stereo .lkd animations in your browser or desktop.</desc>

  <defs>
    <clipPath id="caroClip">
      <rect width="600" height="280" rx="12"/>
    </clipPath>
  </defs>

  <a href="https://carozerra.yousufkhan.uk/" target="_blank" style="cursor: pointer;">
    <!-- Chassis Frame -->
    <g clip-path="url(#caroClip)">
      <rect width="600" height="280" fill="#0b0f14"/>

      <!-- CD Eject Slot (Recessed 1-DIN Slot) -->
      <rect x="120" y="10" width="360" height="3.5" rx="1.75" fill="#030508"/>
      <line x1="120" y1="10" x2="480" y2="10" stroke="#161e27" stroke-width="0.75"/>

      <!-- Pioneer Faceplate Branding -->
      <g transform="translate(24, 32)">
        <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
              font-size="13" font-weight="700" letter-spacing="1" fill="#c4cdd2">
          Pioneer
        </text>
        <text x="58" y="0" font-family="Georgia, serif" font-style="italic"
              font-size="12" fill="#7d8b99">
          carrozzeria
        </text>
      </g>

      <!-- Model Stamp (Right Top) -->
      <text x="576" y="32" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="10.5" fill="#586775">
        DEH-P7600MP &#183; 256&#215;64 OEL
      </text>

      <!-- Left Control Panel (Rotary Volume Knob + Source Keys) -->
      <g transform="translate(24, 52)">
        <!-- Rotary Knob Bezel -->
        <circle cx="36" cy="40" r="32" fill="#121820" stroke="#202936" stroke-width="1.5"/>
        <circle cx="36" cy="40" r="26" fill="#0d1218" stroke="#17202b" stroke-width="1"/>
        <circle cx="36" cy="40" r="8" fill="#161f2a"/>
        <!-- Notch indicator -->
        <line x1="36" y1="16" x2="36" y2="22" stroke="#7d8b99" stroke-width="2" stroke-linecap="round"/>

        <!-- Hardware Keys -->
        <g transform="translate(0, 88)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#7d8b99">
          <rect x="0" y="0" width="34" height="20" rx="3" fill="#121820" stroke="#1f2733" stroke-width="1"/>
          <text x="17" y="13.5" text-anchor="middle">SRC</text>

          <rect x="38" y="0" width="34" height="20" rx="3" fill="#121820" stroke="#1f2733" stroke-width="1"/>
          <text x="55" y="13.5" text-anchor="middle">DISP</text>
        </g>
      </g>

      <!-- Recessed OEL Display Bezel Housing -->
      <g transform="translate(106, 50)">
        <rect width="474" height="128" rx="6" fill="#05080c" stroke="#1a232e" stroke-width="1"/>
        <rect x="3" y="3" width="468" height="122" rx="4" fill="#020406"/>

        <!-- Display Top Status Line -->
        <g transform="translate(16, 22)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5">
          <text x="0" y="0" fill="#23cee0" font-weight="600">TR-01 [DIVER DOLPHINS]</text>
          <text x="436" y="0" text-anchor="end" fill="#5b95a3">60 FPS &#183; 83 PRELOADED</text>
        </g>

        <!-- Display Center Graphic: Authentic Pioneer OEL Diving Dolphin Scene -->
        <g transform="translate(16, 36)">
          <!-- Ocean Horizon Line -->
          <line x1="0" y1="50" x2="280" y2="50" stroke="#16515e" stroke-width="1"/>
          <line x1="0" y1="56" x2="280" y2="56" stroke="#0e3740" stroke-width="1" stroke-dasharray="4 2"/>

          <!-- Stylized Retro Dolphin Silhouette in Cyan Phosphor -->
          <path d="M 60 46 C 72 30, 94 18, 120 20 C 144 22, 164 34, 180 48 C 168 42, 150 40, 134 42 C 122 43, 106 47, 90 52 Z"
                fill="#23cee0"/>
          <!-- Dorsal Fin -->
          <path d="M 118 20 L 126 10 L 132 21 Z" fill="#23cee0"/>
          <!-- Tail Flukes -->
          <path d="M 58 47 L 42 40 L 46 49 L 40 54 Z" fill="#23cee0"/>
          <!-- Splash Droplets -->
          <circle cx="188" cy="50" r="1.5" fill="#23cee0"/>
          <circle cx="194" cy="47" r="1" fill="#23cee0"/>
          <circle cx="198" cy="52" r="1.5" fill="#23cee0"/>

          <!-- Pioneer Graphic Equalizer (Right side of screen) -->
          <g transform="translate(300, 4)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
            <!-- 8 Spectrum Bands with Floating Peaks -->
            <rect x="0" y="34" width="11" height="20" fill="#23cee0"/>
            <rect x="0" y="28" width="11" height="2" fill="#7ce5f0"/>

            <rect x="16" y="20" width="11" height="34" fill="#23cee0"/>
            <rect x="16" y="14" width="11" height="2" fill="#7ce5f0"/>

            <rect x="32" y="12" width="11" height="42" fill="#23cee0"/>
            <rect x="32" y="6" width="11" height="2" fill="#7ce5f0"/>

            <rect x="48" y="22" width="11" height="32" fill="#23cee0"/>
            <rect x="48" y="16" width="11" height="2" fill="#7ce5f0"/>

            <rect x="64" y="16" width="11" height="38" fill="#23cee0"/>
            <rect x="64" y="10" width="11" height="2" fill="#7ce5f0"/>

            <rect x="80" y="26" width="11" height="28" fill="#23cee0"/>
            <rect x="80" y="20" width="11" height="2" fill="#7ce5f0"/>

            <rect x="96" y="32" width="11" height="22" fill="#23cee0"/>
            <rect x="96" y="26" width="11" height="2" fill="#7ce5f0"/>

            <rect x="112" y="40" width="11" height="14" fill="#23cee0"/>
            <rect x="112" y="34" width="11" height="2" fill="#7ce5f0"/>
          </g>
        </g>

        <!-- Display Bottom Status Line -->
        <g transform="translate(16, 110)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">
          <text x="0" y="0" fill="#23cee0">&#9654; PLAY</text>
          <text x="52" y="0" fill="#5b95a3">02:48</text>
          <text x="120" y="0" fill="#5b95a3">ZLKD &#183; GZIP+TAR+BMP</text>
          <text x="436" y="0" text-anchor="end" fill="#23cee0">GIF EXPORT</text>
        </g>
      </g>

      <!-- Bottom Description Strip with Official Carozerra Logo Mark from repo (favicon.svg) -->
      <g transform="translate(24, 196)">
        <!-- Official Carozerra Logo Mark (22x22) -->
        <g transform="translate(0, 0) scale(0.6875)">
          <rect width="32" height="32" rx="6" fill="#15191c" stroke="#25323d" stroke-width="1.2"/>
          <g fill="#23cee0">
            <rect x="3.5" y="9.5" width="4" height="13"/>
            <rect x="10.5" y="4.5" width="4" height="23"/>
            <rect x="17.5" y="7" width="4" height="18"/>
            <rect x="24.5" y="12" width="4" height="8"/>
          </g>
        </g>

        <text x="32" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif"
              font-size="13.5" font-weight="600" fill="#f0f6fc">
          Carozerra
        </text>
        <text x="108" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif"
              font-size="12" font-weight="400" fill="#7d8b99">
          Browser player, desktop visualizer, and .lkd animation decoder
        </text>
      </g>

      <!-- Bottom Footer Strip -->
      <g transform="translate(0, 240)">
        <rect width="600" height="40" fill="#0d1117"/>
        <line x1="0" y1="0" x2="600" y2="0" stroke="#1a222c" stroke-width="1"/>

        <!-- Left link -->
        <text x="24" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif"
              font-size="12" font-weight="500" fill="#23cee0">
          carozerra.yousufkhan.uk
        </text>

        <!-- Right link -->
        <text x="576" y="24" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="11.5" font-weight="400" fill="#64748b">
          github.com/youxufkhan/carozerra
        </text>
      </g>
    </g>

    <!-- Hairline Border -->
    <rect width="600" height="280" rx="12" fill="none" stroke="#212936" stroke-width="1"/>
  </a>
</svg>